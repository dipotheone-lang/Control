[project]
name = "control-engine"
version = "0.1.0"
description = "Control — adaptive obligation & deadline control engine for UBCSIS (charter v4.3)"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=4.0",
    "python-docx>=1.1",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "msal>=1.28",
    "requests>=2.31",
    "cryptography>=42.0",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
