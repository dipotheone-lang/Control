# Working calendar and external SLAs — charter §8.3, §8.5
# Class 1 and 2 obligations ignore the working calendar entirely (§8.3).

working_calendar:
  working_days: [sunday, monday, tuesday, wednesday, thursday]
  timezone: Africa/Cairo          # IANA zone, never a hardcoded UTC offset (§5.1)
  # Working hours for the §7.3 S1 out-of-hours signal — O-11, closed by
  # the CEO on 16-Aug-2026 as 09:00–17:00, Sunday–Thursday.
  #
  # The signal stays SILENT unless start, end and confirmed_by_ceo are
  # all present (§8.3). It produces observations about when people work,
  # so an unconfirmed edit must not be able to switch it on.
  #
  # set_by records who actually set the value, not who the charter
  # nominates. §8.3 nominates HR; here the CEO set it directly, which
  # is within his authority (§17) but is worth stating rather than
  # dressing up as an HR submission. HR should countersign these hours
  # into the IWR under O-06 so the employment record and this file agree.
  working_hours:
    start: "09:00"
    end: "17:00"
    set_by: ahmed@ubcsis.com
    set_on: 2026-08-16
    confirmed_by_ceo: true
    hr_countersign_pending: true    # O-06, IWR alignment
  # Deadlines move to the next working day; no class 3 reminders on
  # non-working days.
  holidays: []
  # Egyptian public holidays — populate and maintain. Stale by 60+ days -> flag.
  holidays_last_updated: null

# External watchdog SLAs — §8.5. first_response / final. Notices go ONLY to
# the internal owner (manager after first breach), never to the external party.
external_sla:
  client_complaint:    { first: 2h,  final: same-day, owner: ghareeb@ubcsis.com, backup: ahmed@ubcsis.com }
  client_rfq_tender:   { first: 4h,  final: 1d,       owner: donia@ubcsis.com,   backup: info@ubcsis.com }
  sales_enquiry:       { first: 1d,  final: 2d,       owner: info@ubcsis.com,    backup: donia@ubcsis.com }   # sales@ interim
  supplier:            { first: 1d,  final: 2d,       owner: info@ubcsis.com,    backup: ghareeb@ubcsis.com } # procure@ interim
  invoice_payment_tax: { first: 4h,  final: 1d,       owner: accounts@ubcsis.com, backup: hadeer@ubcsis.com }
  authority_bank_legal: { first: 4h, final: 1d,       owner: ahmed@ubcsis.com,   backup: ghareeb@ubcsis.com }
  hse_inspection_cert: { first: 4h,  final: 1d,       owner: hse@ubcsis.com,     backup: ghareeb@ubcsis.com }
  recruitment_labour:  { first: 1d,  final: 2d,       owner: hr@ubcsis.com,      backup: ghareeb@ubcsis.com }
  marketing_platforms: { first: 1d,  final: 2d,       owner: marketing@ubcsis.com, backup: info@ubcsis.com }
  unclassified:        { first: 1d,  final: 2d,       owner: ghareeb@ubcsis.com, backup: ahmed@ubcsis.com }

# Thread closes on an observed outbound UBCSIS reply, or the owner replying
# CLOSED (logged with declarant).
#
# Scope limitation (§3.1a): coverage is limited to threads copied to
# control@. Traffic in sales@ and procure@ is not visible.
#
# O-05 is closed as decision D-07 (Option C — extended mailbox scope),
# superseding D-02. The limitation above still stands, because a
# decision is not a deployment: the scope change is gated on O-07, O-08
# and O-10. See config/mailbox-scope.yaml, which is the operative
# record of what Control may read today.
