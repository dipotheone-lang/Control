    owner: accounts@ubcsis.com          # Mohamed Abdelsadiq, Acting CFO
    preparer: hadeer@ubcsis.com         # Hadeer Mohamed
    escalation: ahmed@ubcsis.com        # CEO, same day (§2.1)
    cadence: quarterly
    rule: UNVERIFIED — quarterly review date pending
    provenance: ceo_stated
    decision: D-40
    mechanism: watch
    on_issue: >
      Every PDPL position recorded under D-52 becomes reviewable. Raise
      as a CEO decision, not as a configuration change.

  # B7. An obligation that exists without a known way to discharge it.
  # Recording it as absent would be false; recording it as satisfied
  # would be worse. It is recorded as owed, with the mechanism unknown.
  - id: STAT-PDPL-REG
    name: PDPL controller registration
    owner: accounts@ubcsis.com          # Mohamed Abdelsadiq, Acting CFO
    preparer: hadeer@ubcsis.com         # Hadeer Mohamed
    escalation: ahmed@ubcsis.com        # CEO, same day (§2.1)
    cadence: one_off
    rule: UNVERIFIED — mechanism unknown
    obligation_exists: true
    mechanism_available: unknown
    provenance: ceo_stated
    decision: D-35, D-39, D-40
    note: >
      Registration is required (D-35) with no size exemption (D-39), but
      the mechanism depends on regulations that have not issued (D-40).

