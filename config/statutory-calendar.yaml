  # ETA e-invoicing is split because the two halves fail differently.
  # Phase 0 found 767 messages from invoicing.eta.gov.eg, so both are
  # live rather than dormant.
  #
  # B2: submission is real-time. It has no countdown, so it is exception
  # detection — a submission that did not happen — not a deadline. A
  # countdown here would alert every day on a thing with no due date.
  - id: STAT-ETA-SUB
    name: ETA electronic invoicing — submission
    owner: accounts@ubcsis.com          # Mohamed Abdelsadiq, Acting CFO
    preparer: hadeer@ubcsis.com         # Hadeer Mohamed
    escalation: ahmed@ubcsis.com        # CEO, same day (§2.1)
    cadence: continuous
    rule: real-time — exception detection, no countdown
    provenance: ceo_stated
    decision: D-16
    mechanism: exception_detection
    evidence: Phase 0 — 767 messages from invoicing.eta.gov.eg

  # B1: the tightest statutory window in the system. Seven days from
  # rejection, checked DAILY — a weekly check burns six of the seven.
  # Event-driven: the clock starts when ETA rejects, so it cannot be a
  # cadence and is refused by the due parser on purpose.
  #
  # M1 (execution order §3.1): Control reads control@ only, so it cannot
  # see accounts@. Detection of the rejection itself stays MANUAL, and
  # that cost is stated in every management report.
  - id: STAT-ETA-REJ
    name: ETA electronic invoicing — rejection clearance
    owner: accounts@ubcsis.com          # Mohamed Abdelsadiq, Acting CFO
    preparer: hadeer@ubcsis.com         # Hadeer Mohamed
    escalation: ahmed@ubcsis.com        # CEO, same day (§2.1)
    cadence: event
    rule: 7 days from rejection
    trigger: rejection notice received from ETA
    window_days: 7                      # D-31, ceo_stated (was null)
    check_frequency: daily
    provenance: ceo_stated
    decision: D-31
    mechanism: event_window
    manual_detection: true
    manual_detection_reason: >
      Rejections arrive in accounts@, which is outside the M1 scope of
      control@ only. Control cannot see them, so a human must enter the
      rejection date. Until D-07 reactivates, this window is unautomated.

  - id: STAT-CIT
    name: Corporate income tax — return and payment
    owner: accounts@ubcsis.com          # Mohamed Abdelsadiq, Acting CFO
    preparer: hadeer@ubcsis.com         # Hadeer Mohamed
    escalation: ahmed@ubcsis.com        # CEO, same day (§2.1)
    cadence: annual
    rule: 31 March
    provenance: ceo_stated
    decision: D-25, D-27, D-28
    note: Financial year ends 31 December.

  # B3 + B4. The clock starts at the EVENT — a joiner or leaver — not at
  # the moment HR gets round to registering it. HR registering within
  # five working days consumes that much of the thirty, so the effective
  # window is twenty-five days, and computing from the registration date
  # would hide exactly that erosion.
  - id: STAT-SI-HEADCOUNT
    name: Social insurance — headcount declaration
    owner: accounts@ubcsis.com          # Mohamed Abdelsadiq, Acting CFO
    preparer: hadeer@ubcsis.com         # Hadeer Mohamed
    escalation: ahmed@ubcsis.com        # CEO, same day (§2.1)
    cadence: event
    rule: 30 days from event
    window_days: 30                     # counted from the event (B4)
    trigger: joiner or leaver
    # No check_frequency. B1 specifies a daily check for the ETA
    # rejection window and says nothing about this one, and a 30-day
    # window is served by the §2.1 ladder (T-7, T-3, T-1, on the day).
    # Adding one here would be Control inventing a rule (§1.3).
    # 25 is what is LEFT if HR registers within its 5-working-day
    # target. It is an expectation, not the rule — the deadline is
    # always 30 days from the event, and the actual erosion is computed
    # from the actual registration lag rather than from this number.
    hr_registration_target_working_days: 5
    effective_window_days_if_target_met: 25
    provenance: ceo_stated
    decision: D-20, D-21
    mechanism: event_window

  - id: STAT-REG
