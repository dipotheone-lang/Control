# Statutory calendar — charter §2.1 (Class 1 obligations)
# Owner: Mohamed Abdelsadiq (accounts@) · Preparer: Hadeer Mohamed (hadeer@)
# Escalation: CEO, same day. Alerts T-7, T-3, T-1, and on the day.
# Class 1 never suppresses for weekends, holidays, leave, or reminder limits.
#
# PROVENANCE — read this before trusting a date below.
#
# Every rule here is `ceo_stated: true, verified_by_advisor: false`. The
# CEO supplied them in the execution order of 18-Aug-2026 so that the
# system could start working from what is known rather than waiting for
# what is not. That is a deliberate operating position, not an oversight.
#
# `ceo_stated` is NOT `verified_by_advisor` and never becomes it by
# time passing or by the system running without incident. Only a named
# advisor confirming a rule promotes it (O-03), and §7 of the execution
# order makes promotion without a named human a stop condition.
#
# The learning engine may never modify a statutory deadline (§14.2 C).

verified_by_advisor: false
ceo_stated: true
ceo_stated_on: 2026-08-18
ceo_stated_by: ahmed@ubcsis.com
source: Execution order 18-Aug-2026 §2.3
last_verified: null
next_annual_verification: null   # set to January after first verification

obligations:
  # D-15, D-19. Two dates, deliberately: the statutory one is when the
  # law falls due, the operative one is when Control acts. The lead is
  # applied to the operative rule only, so the anchor never moves.
  - id: STAT-VAT
    name: VAT return and payment
    owner: accounts@ubcsis.com          # Mohamed Abdelsadiq, Acting CFO
    preparer: hadeer@ubcsis.com         # Hadeer Mohamed
    escalation: ahmed@ubcsis.com        # CEO, same day (§2.1)
    cadence: monthly
    rule: end of the following month, -5 working days
    statutory_rule: end of the following month
    provenance: ceo_stated
    decision: D-15, D-19

  - id: STAT-WHT
    name: Withholding tax
    owner: accounts@ubcsis.com          # Mohamed Abdelsadiq, Acting CFO
    preparer: hadeer@ubcsis.com         # Hadeer Mohamed
    escalation: ahmed@ubcsis.com        # CEO, same day (§2.1)
    cadence: monthly
    # Lead set by the CEO on 30-Aug-2026, closing the open question that
    # stood here. Five working days, matching VAT: the same person
    # prepares both, and the only other rule with a lead uses it.
    #
    # The statutory date stays the anchor — `statutory_rule` below is
    # what the law requires. The lead moves when Control acts, never
    # when the filing falls due, so it can only ever make Control early.
    rule: end of the following month, -5 working days
    statutory_rule: end of the following month
    provenance: ceo_stated
    decision: D-22, D-59

  # D-23, D-24. Return AND remittance — two acts, and the execution
  # order's own highest-value test is whether the year holds twelve
  # remittances rather than four. If it does, this rule is wrong and
  # eleven obligations are missing.
  # SPLIT 30-Aug-2026 by the CEO, closing the open question that stood
  # here. The comment above was the register's own doubt: if the year
  # holds twelve remittances rather than four, one quarterly row hides
  # eleven obligations. It does — the remittance is monthly and the
  # return is quarterly, so they are two rows that fail differently.
  #
  # Both dates are ceo_stated and unverified like every other row here.
  # A wrong monthly date fires twelve wrong alerts a year, so O-03 gets
  # these two before it gets anything else.
  - id: STAT-PAYROLL-REM
    name: Payroll tax — monthly remittance
    owner: accounts@ubcsis.com          # Mohamed Abdelsadiq, Acting CFO
    preparer: hadeer@ubcsis.com         # Hadeer Mohamed
    escalation: ahmed@ubcsis.com        # CEO, same day (§2.1)
    cadence: monthly
    rule: end of the following month
    provenance: ceo_stated
    decision: D-23, D-24, D-59
    note: >
      Same shape as VAT and withholding tax. No preparation lead is set:
      Control acts on the statutory date itself, which is later than
      ideal but never later than the law. Ask for a lead when O-03 is
      answered.

  - id: STAT-PAYROLL-RET
    name: Payroll tax — quarterly reconciliation return
    owner: accounts@ubcsis.com          # Mohamed Abdelsadiq, Acting CFO
    preparer: hadeer@ubcsis.com         # Hadeer Mohamed
    escalation: ahmed@ubcsis.com        # CEO, same day (§2.1)
    cadence: quarterly
    # 31 Jan, 30 Apr, 31 Jul, 31 Oct. The day differs by month, which is
    # why this cannot be written as a day-of-month — and why the engine
    # refuses a bare one against a quarterly cadence rather than
    # computing it monthly.
    rule: end of the month after each quarter
    provenance: ceo_stated
    decision: D-23, D-24, D-59

  - id: STAT-SOCINS
    name: Social insurance contributions
    owner: accounts@ubcsis.com          # Mohamed Abdelsadiq, Acting CFO
    preparer: hadeer@ubcsis.com         # Hadeer Mohamed
    escalation: ahmed@ubcsis.com        # CEO, same day (§2.1)
    cadence: monthly
    rule: day 15
    provenance: ceo_stated
    decision: D-30

  # ETA e-invoicing is split because the two halves fail differently.
  # Phase 0 found 767 messages from invoicing.eta.gov.eg, so both are
  # live rather than dormant.
  #
  # B2: submission is real-time. It has no countdown, so it is exception
  # detection — a submission that did not happen — not a deadline. A
  # countdown here would alert every day on a thing with no due date.
  - id: STAT-ETA-SUB
    name: ETA electronic invoicing — submission
    owner: accounts@ubcsis.com          # Mohamed Abdelsadiq, Acting CFO
    preparer: hadeer@ubcsis.com         # Hadeer Mohamed
    escalation: ahmed@ubcsis.com        # CEO, same day (§2.1)
    cadence: continuous
    rule: real-time — exception detection, no countdown
    provenance: ceo_stated
    decision: D-16
    mechanism: exception_detection
    evidence: Phase 0 — 767 messages from invoicing.eta.gov.eg

  # B1: the tightest statutory window in the system. Seven days from
  # rejection, checked DAILY — a weekly check burns six of the seven.
  # Event-driven: the clock starts when ETA rejects, so it cannot be a
  # cadence and is refused by the due parser on purpose.
  #
  # M1 (execution order §3.1): Control reads control@ only, so it cannot
  # see accounts@. Detection of the rejection itself stays MANUAL, and
  # that cost is stated in every management report.
  - id: STAT-ETA-REJ
    name: ETA electronic invoicing — rejection clearance
    owner: accounts@ubcsis.com          # Mohamed Abdelsadiq, Acting CFO
    preparer: hadeer@ubcsis.com         # Hadeer Mohamed
    escalation: ahmed@ubcsis.com        # CEO, same day (§2.1)
    cadence: event
    rule: 7 days from rejection
    trigger: rejection notice received from ETA
    window_days: 7                      # D-31, ceo_stated (was null)
    check_frequency: daily
    provenance: ceo_stated
    decision: D-31
    mechanism: event_window
    manual_detection: true
    manual_detection_reason: >
      Rejections arrive in accounts@, which is outside the M1 scope of
      control@ only. Control cannot see them, so a human must enter the
      rejection date. Until D-07 reactivates, this window is unautomated.

  - id: STAT-CIT
    name: Corporate income tax — return and payment
    owner: accounts@ubcsis.com          # Mohamed Abdelsadiq, Acting CFO
    preparer: hadeer@ubcsis.com         # Hadeer Mohamed
    escalation: ahmed@ubcsis.com        # CEO, same day (§2.1)
    cadence: annual
    rule: 31 March
    provenance: ceo_stated
    decision: D-25, D-27, D-28
    note: Financial year ends 31 December.

  # B3 + B4. The clock starts at the EVENT — a joiner or leaver — not at
  # the moment HR gets round to registering it. HR registering within
  # five working days consumes that much of the thirty, so the effective
  # window is twenty-five days, and computing from the registration date
  # would hide exactly that erosion.
  - id: STAT-SI-HEADCOUNT
    name: Social insurance — headcount declaration
    owner: accounts@ubcsis.com          # Mohamed Abdelsadiq, Acting CFO
    preparer: hadeer@ubcsis.com         # Hadeer Mohamed
    escalation: ahmed@ubcsis.com        # CEO, same day (§2.1)
    cadence: event
    rule: 30 days from event
    window_days: 30                     # counted from the event (B4)
    trigger: joiner or leaver
    # B3. The HR roster obligation is what puts a joiner or leaver in
    # front of Control. That makes it more than a class 3 report: it
    # starts a statutory clock, so when it is overdue the consequence
    # is stated in class 1 terms rather than waiting for the class 3
    # ladder to reach the CEO at +5 working days.
    #
    # The id below is the one §3.3 describes ("Joiner and leaver updates
    # are a class 3 obligation owned by HR"). It does not exist in
    # `obligations.yaml` yet — that register is populated by Phase 0
    # Stage D and approved by the CEO (§6) — and Control reports the
    # link as unfulfilled rather than assuming it works.
    registered_by_obligation: HR-ROSTER-001
    # No check_frequency. B1 specifies a daily check for the ETA
    # rejection window and says nothing about this one, and a 30-day
    # window is served by the §2.1 ladder (T-7, T-3, T-1, on the day).
    # Adding one here would be Control inventing a rule (§1.3).
    # 25 is what is LEFT if HR registers within its 5-working-day
    # target. It is an expectation, not the rule — the deadline is
    # always 30 days from the event, and the actual erosion is computed
    # from the actual registration lag rather than from this number.
    hr_registration_target_working_days: 5
    effective_window_days_if_target_met: 25
    provenance: ceo_stated
    decision: D-20, D-21
    mechanism: event_window

  - id: STAT-REG
    name: Commercial register, tax card, industrial register — renewals
    owner: accounts@ubcsis.com          # Mohamed Abdelsadiq, Acting CFO
    preparer: hadeer@ubcsis.com         # Hadeer Mohamed
    escalation: ahmed@ubcsis.com        # CEO, same day (§2.1)
    cadence: annual
    rule: UNVERIFIED — renewal dates pending (Mohamed Ali, from certificates)
    provenance: ceo_stated
    decision: D-29
    open_question: renewal dates x 3
    # Transcribed from the `rule` line above ("Mohamed Ali, from
    # certificates"), for the same reason as STAT-PAYROLL.
    answer_held_by: hr@ubcsis.com

  # B6. Not a filing — a watch. The PDPL executive regulations are still
  # pending (D-40), and every PDPL answer in the governance pack becomes
  # reviewable on the day they issue. A quarterly review is the cheapest
  # way to not miss that.
  #
  # Two different things are outstanding here and they have different
  # owners. WHEN the review happens is an internal scheduling choice —
  # pick a date and the quarterly cadence anchors from it. WHAT the
  # review is about is counsel's, which is what `answered_by` records
  # and why this row stays out of the tax advisor brief.
  #
  # The `open_question` below was missing until 30-Aug-2026. Every other
  # rule awaiting a date carried one, so this one was the only class 1
  # obligation waiting on an answer that nothing was asking for.
  - id: STAT-PDPL-REGS
    name: PDPL executive regulations — watch for issue
    # Not a tax matter. The advisor brief only carries rows a tax
    # advisor can answer; asking one about data-protection regulations
    # wastes their time and ours, and dilutes the rows that matter.
    answered_by: counsel
    owner: accounts@ubcsis.com          # Mohamed Abdelsadiq, Acting CFO
    preparer: hadeer@ubcsis.com         # Hadeer Mohamed
    escalation: ahmed@ubcsis.com        # CEO, same day (§2.1)
    cadence: quarterly
    # Set by the CEO on 30-Aug-2026, closing the open question below.
    # Calendar quarters: 1 Jan, 1 Apr, 1 Jul, 1 Oct — the anchor names
    # one and the cadence steps the rest. Day 1 is clear of the two live
    # statutory dates (social insurance on day 15, VAT around day 20-23),
    # so the review does not land inside their alert windows.
    #
    # This is a scheduling choice and not a legal date: nothing external
    # fixes when the company looks. `provenance` stays `ceo_stated` and
    # the row still reports as unverified, because the SUBJECT — whether
    # the executive regulations have issued and what changes — is
    # counsel's and remains unanswered (D-40).
    rule: 1 October
    provenance: ceo_stated
    decision: D-40
    mechanism: watch
    on_issue: >
      Every PDPL position recorded under D-52 becomes reviewable. Raise
      as a CEO decision, not as a configuration change.

  # B7. An obligation that exists without a known way to discharge it.
  # Recording it as absent would be false; recording it as satisfied
  # would be worse. It is recorded as owed, with the mechanism unknown.
  - id: STAT-PDPL-REG
    name: PDPL controller registration
    answered_by: counsel
    owner: accounts@ubcsis.com          # Mohamed Abdelsadiq, Acting CFO
    preparer: hadeer@ubcsis.com         # Hadeer Mohamed
    escalation: ahmed@ubcsis.com        # CEO, same day (§2.1)
    cadence: one_off
    rule: UNVERIFIED — mechanism unknown
    obligation_exists: true
    mechanism_available: unknown
    provenance: ceo_stated
    decision: D-35, D-39, D-40
    note: >
      Registration is required (D-35) with no size exemption (D-39), but
      the mechanism depends on regulations that have not issued (D-40).

