# Continuity — charter §5.2, CEO decision D-11 (16-Aug-2026)
#
# "Daily encrypted backup of the WHOLE of CONTROL_ROOT — database,
#  hash-chained logs, outbox, learning records — before first write. A
#  chain that is not backed up can be truncated undetectably by a dead
#  laptop."
#
# CEO decision: back up into the company Microsoft 365 tenant
# (OneDrive / SharePoint). Reasoning recorded because it is not
# obvious: the mail already lives in that tenant, so this adds no new
# processor under §12.2 and no new NDA exposure — while an external
# drive kept in the same office does not survive the event that takes
# the laptop.

destination:
  # Absolute path to the synced folder. Left null so it is set on the
  # machine that will actually run, rather than guessed here.
  #
  # auto_detect resolves it from the Windows OneDrive environment
  # variables when path is null: OneDriveCommercial first, then
  # OneDrive. If neither resolves, backup reports NOT CONFIGURED and
  # says so — it never silently writes nowhere.
  # Set by the CEO on 30-Aug-2026 (D-59). The company drive, not
  # OneDrive: the tenant was never provisioned and waiting for it left
  # the audit chain existing only on the laptop.
  #
  # WHAT THIS BUYS — corrected 31-Aug-2026, having actually looked.
  #
  # E: is a FIXED volume with 26.4 GB free, not the removable drive the
  # decision was written assuming. Two consequences, opposite in sign:
  #
  #   Better: it is always attached, so the daily backup runs without
  #   anybody remembering anything. The "backs up nothing on the days
  #   E: is unplugged" risk recorded in D-59 does not exist.
  #
  #   Worse, and now MEASURED rather than suspected: C: and E: are both
  #   partitions of DiskNumber 0. One physical disk. The backup does not
  #   survive disk failure, theft, or loss of the laptop — the three
  #   events D-11 exists for — and D-59's stated reasoning, that it
  #   "survives the laptop, which a folder in the user profile would
  #   not", is false. A partition on the same disk survives the laptop
  #   no better than the user profile does.
  #
  # So this destination protects against ONE thing: accidental deletion
  # of CONTROL_ROOT. That is real and worth having, and it is not what
  # D-11 asked for. It is left in place because a backup on the same
  # disk beats no backup at all, and marked here as INADEQUATE against
  # D-11 so nobody reads a green backup line as continuity.
  #
  # The decision belongs to the CEO. The honest options are a USB drive
  # (which then really does have the "nothing on the days it is out"
  # risk), a network share reachable by UNC — a scheduled task may not
  # see a mapped letter — or the OneDrive tenant D-11 named and D-59
  # recorded as never provisioned.
  #
  # It does NOT survive a fire in the office either way. §13.3's
  # backup-age line and the restore test are the controls that matter
  # here, not the destination: a backup nobody checks the age of is a
  # hope, and one nobody has restored is a guess.
  #
  # Windows path on purpose: this file is read on the laptop that runs.
  path: E:\UBCSIS Co Date Jan 2026\Control-Backup
  auto_detect: onedrive
  subfolder: null

encryption:
  # Non-negotiable. An unencrypted backup of this data in a synced
  # folder would be a worse exposure than the risk it mitigates.
  enabled: true
  # Where the key lives. Windows Credential Manager via keyring, under
  # this service name. Never in a file, never in this repository (§5.1).
  keyring_service: ubcsis-control-backup
  # Fallback for headless runs only. If both are absent, backup halts
  # rather than writing plaintext.
  env_var: CONTROL_BACKUP_KEY

schedule:
  daily: true
  # §5.2: before first write. A cycle that cannot back up does not
  # proceed to modify the record it has not protected.
  before_first_write: true

retention:
  # Aligned with the Class C proposal in docs/governance/RETENTION-SCHEDULE.md.
  # Confirm with counsel under O-10; until then this is the operating value.
  keep_days: 365
  # Always keep at least this many, however old, so a long outage can
  # never leave zero backups on disk.
  keep_minimum: 7

restore_test:
  # §13.3 continuity line: backup age AND last successful restore test.
  # An untested backup is a hope, not a control.
  every_days: 30
  last_tested: null
  last_result: null
