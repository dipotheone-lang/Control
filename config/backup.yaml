# Continuity — charter §5.2, CEO decision D-11 (16-Aug-2026)
#
# "Daily encrypted backup of the WHOLE of CONTROL_ROOT — database,
#  hash-chained logs, outbox, learning records — before first write. A
#  chain that is not backed up can be truncated undetectably by a dead
#  laptop."
#
# CEO decision: back up into the company Microsoft 365 tenant
# (OneDrive / SharePoint). Reasoning recorded because it is not
# obvious: the mail already lives in that tenant, so this adds no new
# processor under §12.2 and no new NDA exposure — while an external
# drive kept in the same office does not survive the event that takes
# the laptop.

destination:
  # OneDrive, chosen by the CEO on 31-Aug-2026 (D-60), replacing the E:
  # drive D-59 set the day before.
  #
  # WHY E: WAS WRONG, measured rather than assumed: C: and E: are both
  # partitions of DiskNumber 0. One physical disk. A backup there does
  # not survive disk failure, theft, or loss of the laptop — the three
  # events D-11 exists for — so D-59's reasoning that it "survives the
  # laptop, which a folder in the user profile would not" was false. It
  # protected against accidental deletion of CONTROL_ROOT and nothing
  # else.
  #
  # WHAT THIS IS NOT: the company Microsoft 365 tenant D-11 named. This
  # machine carries a PERSONAL OneDrive — the folder is plain "OneDrive"
  # and OneDriveCommercial is unset, which is how Windows distinguishes
  # them. D-11 chose the company tenant precisely because the mail
  # already lives there, so it adds no new processor under §12.2 and no
  # new NDA exposure. A personal account adds both.
  #
  # WHAT MAKES IT ACCEPTABLE MEANWHILE: the archive is encrypted with
  # Fernet BEFORE it is written, and the key lives in Windows Credential
  # Manager, never in the file and never in this repository. What syncs
  # is ciphertext. A personal account holding an encrypted blob is a far
  # smaller exposure than one holding readable company records — and it
  # is off the machine, which E: never was.
  #
  # THE CONDITION THAT MAKES IT A BACKUP AT ALL: the key is on the
  # laptop. If the laptop dies and the key was never written down
  # elsewhere, the synced archives are unrecoverable by anyone,
  # including the CEO. Escrow is not a nicety here; it is the half of
  # the mechanism that survives.
  #
  # Path stays null and auto_detect does the work: hardcoding a path
  # bakes in one machine's user name, and this file is version
  # controlled.
  path: null
  auto_detect: onedrive
  subfolder: UBCSIS-Control-Backup

encryption:
  # Non-negotiable. An unencrypted backup of this data in a synced
  # folder would be a worse exposure than the risk it mitigates.
  enabled: true
  # Where the key lives. Windows Credential Manager via keyring, under
  # this service name. Never in a file, never in this repository (§5.1).
  keyring_service: ubcsis-control-backup
  # Fallback for headless runs only. If both are absent, backup halts
  # rather than writing plaintext.
  env_var: CONTROL_BACKUP_KEY

schedule:
  daily: true
  # §5.2: before first write. A cycle that cannot back up does not
  # proceed to modify the record it has not protected.
  before_first_write: true

retention:
  # Aligned with the Class C proposal in docs/governance/RETENTION-SCHEDULE.md.
  # Confirm with counsel under O-10; until then this is the operating value.
  keep_days: 365
  # Always keep at least this many, however old, so a long outage can
  # never leave zero backups on disk.
  keep_minimum: 7

restore_test:
  # §13.3 continuity line: backup age AND last successful restore test.
  # An untested backup is a hope, not a control.
  every_days: 30
  last_tested: null
  last_result: null
