# Client accreditation register — seed rows (charter §2.2)
#
# Load with:
#   python -m control registers --import-file config/accreditations-seed.yaml
#
# WHY THESE ROWS EXIST WITH NO EXPIRY DATES
#
# §2.2: "A lapsed prequalification produces silent revenue decline: you
# stop being invited rather than being rejected."
#
# That failure is invisible by construction, so an empty register and a
# healthy one look identical. These rows make the gap visible instead:
# every known client is on the register with status UNKNOWN and a named
# renewal owner, so the missing expiry date is a finding with somebody's
# name on it rather than an absence nobody notices.
#
# status UNKNOWN is deliberately not PENDING. Pending means an
# application is in progress. Unknown means nobody has checked, and
# conflating the two would hide exactly the case §2.2 warns about.
#
# Alerts at 90/60/30 days cannot fire until expiry_date is filled. Until
# then these rows are a to-do list, and they say so.
#
# source: BACKFILL — these come from Phase 0 evidence, not from a
# received document (§5.2).

accreditations:
