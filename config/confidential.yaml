confidential_folders: []   # from Phase 0 inventory (Stage I)
confidential_projects: []  # project codes mapped to confidential clients

classification_rules:
  # §12.1.1 — an item is confidential if ANY hold:
  - sender or recipient domain belongs to a listed client
  - attachment or subject references a project mapped to such a client
  - confidentiality/proprietary/restricted marking in filename or first-page header
  - file sits in a folder classified client-confidential in the Phase 0 inventory
  - classification is genuinely uncertain   # asymmetry decides borderline cases

metadata_only_mode:
  permitted: [sender, recipients, timestamp, subject, attachment_filename,
              file_type, file_size, page_or_sheet_count,
              form_code_from_filename_only, thread_position]
  prohibited: [opening body, OCR, text extraction, figure extraction,
               posting values to registers, quoting content anywhere,
               retaining file beyond mailbox, passing contents to any
               model or external service]
  checks: C1 full; C2 filename-only; C3-C7 not run; S1-S4 metadata signals only
  verdicts: [RECEIVED_ON_TIME, RECEIVED_LATE, NOT_RECEIVED,
             NOT ASSESSED — CONFIDENTIAL SCOPE]
