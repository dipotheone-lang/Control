# Obligation register — charter §2, class 3 (operational)
#
# STARTER REGISTER, assigned by Control from the archive — 26-Aug-2026.
#
# The CEO's instruction of 26-Aug-2026: *"you assign as per archives and past
# experience and will improve on the go while running."* This file is that
# assignment. It is written unapproved — every row carries
# `approved_by_ceo: null` and `build_obligations` refuses every row without it
# (§6), so nothing here is tracked until one command stamps it:
#
#     python -m control register --approve --by ahmed@ubcsis.com
#
# WHAT THE EVIDENCE SUPPORTS, AND WHAT IT DOES NOT (§1.1)
#
# Stage D on 26-Aug-2026 found: GHOST 23, DEAD 13, SHADOW 2, ORPHAN 2,
# FORMLESS 0, LIVE 0. Not one document series on the drive is both current and
# on a controlled form. So no row below can claim to be a reading of current
# practice, and none of them does.
#
# Each row separates three things that are usually collapsed into one:
#
#   `evidence`    — what the archive actually shows. Traceable.
#   `date_basis`  — where the due date came from. Every row below says
#                   `assigned_by_control`: NOT ONE OF THESE DEADLINES WAS
#                   OBSERVED. The cadence is the manual's or the archive's;
#                   the day of the month is Control's, chosen to spread the
#                   load across the month rather than read off anything.
#   `open_question` — what a human has to correct, and it is the same
#                   question on every row.
#
# A wrong deadline alerts confidently on the wrong day, which §2.1 rates worse
# than no deadline. These are live anyway, on the CEO's instruction, because a
# register that is approximately right and correctable beats an empty one that
# tracks nothing — but the approximation is recorded on the row rather than
# hidden behind it. Correcting a date is editing one line and re-running.
#
# The five form-coded rows come from the company's own management system form
# register: the form exists and is required, and Stage D found no document
# series answering it (GHOST). Tracking them is what turns "nobody files this"
# from an invisible fact into a dated finding. The revision is not recorded
# anywhere Control can read, so C2 reports a gap rather than inventing one.
#
# Class 1 statutory items live in config/statutory-calendar.yaml. Class 2
# commercial items live in the class 2 registers (§2.2), not here.
#
# The register is a living document (§14.3): recurring UNSCHEDULED_SUBMISSION
# patterns become candidate obligations (Tier B); obligations unfulfilled for
# three consecutive periods with no escalation resolution become retirement
# candidates (Tier B).

