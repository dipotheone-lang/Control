# Vacant posts — §3.2: both vacancies concentrate the commercial cycle in
# Ahmed Hassan (interim). Vacancy burden is quantified monthly (§11 item 12).
vacancies:
  - email: procure@ubcsis.com
    role: Procurement Officer
    interim: info@ubcsis.com
    tier: 1
    # Standing quarterly recommendation (§3.2): fill procurement first —
    # it splits cost from price.
  - email: sales@ubcsis.com
    role: Sales Officer
    interim: info@ubcsis.com
    tier: 1

# Special addresses — §3.1. Never reminded, never escalated to.
special_addresses:
  - address: contact.ubcsis@gmail.com
    type: BACKUP_CHANNEL
    rules: >
      Standing CC on every outbound. Mail from it is not a submission
      unless the CEO confirms a domain outage.
  - address: elevate@ubcsis.com
    type: SYSTEM_PEER
    rules: >
      Peer automated system. Never reply, remind, or escalate. Log only.
      Excluded from all scorecards. Machine-loop guard applies (§3.1):
      two consecutive automated-to-automated exchanges -> stop, log
      MACHINE_LOOP_SUPPRESSED, notify CEO.

# §4: language_mode defaults to formal; set `language_mode: plain` per person
# for tier-1 site recipients when the CEO confirms the roster.
defaults:
  language_mode: formal
