# Materiality thresholds — charter §7.2
# Per metric: absolute floor and a percentage, whichever binds.
# "A 30% swing on EGP 400 is noise; 5% on EGP 4,000,000 is not."
#
# PENDING: initial values come from Phase 0 Stage F statistical baselines —
# learned, not guessed. Refined continuously by §14.3 (threshold changes are
# Tier B: proposed with evidence, applied only on CEO approval).

metrics: {}
# Entry shape:
# metric_id:
#   floor_abs: 50000        # EGP
#   floor_pct: 10
#   basis: Stage F baseline <ref>
#   set_by: CEO approval <date / proposal id>

# Minimum sample rule (§7.2, v4.3): a baseline below the minimum sample size
# for its type is INSUFFICIENT — NOT USED FOR FLAGGING; statistical S1
# signals stay silent for that metric. Values set from Stage F evidence.
minimum_samples:
  supplier_price_range: null
  metric_variance: null
  submission_timing: null

# CEO flag-volume budget (§14.5, §13.3, v4.3): a Tier A baseline tightening
# that pushes weekly S1-S4 flag volume beyond this budget without at least
# one confirmed-useful flag auto-rolls back. Set from observed Phase 2 load.
# CEO DECISION D-10 (16-Aug-2026): 10 flags per week — about two a
# working day. Chosen as the number the CEO will still open on the
# eleventh, which is the only number that matters here: a channel that
# gets skimmed is a failed control, whatever its threshold says.
#
# Over-budget flags are REPORTED as suppressed, never silently dropped.
# Reviewed against observed volume after 30 days of Phase 2, alongside
# the D-06 authority thresholds.
ceo_flag_budget_per_week: 10
ceo_flag_budget:
  decided: 2026-08-16
  decided_by: ahmed@ubcsis.com
  review_after_days: 30
